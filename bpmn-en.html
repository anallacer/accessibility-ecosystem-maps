<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accessio — BPMN Process</title>
<style>
:root {
  --bg:#f8fafc; --card:#ffffff; --text:#172033; --muted:#667085; --border:#d0d5dd;
  --org:#2e9d57; --access:#f28c28; --user:#e5ae24; --purple:#7c3aed;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}
.wrap{max-width:1900px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 14px;text-align:center;letter-spacing:.03em}
.scroller{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px}
svg{display:block;width:100%;min-width:1600px;height:auto}
.pool{fill:#fff;stroke:var(--text);stroke-width:1.8}
.lane{fill:#fff;stroke:var(--border);stroke-width:1.2}
.laneBand{fill:#f2f4f7;stroke:var(--border);stroke-width:1}
.org{fill:#fff;stroke:var(--org);stroke-width:2.2}
.access{fill:#fff;stroke:var(--access);stroke-width:2.2}
.user{fill:#fff;stroke:var(--user);stroke-width:2.2}
.taskTitle{font-size:14px;font-weight:700;fill:var(--text)}
.taskSub{font-size:11px;fill:var(--muted)}
.laneTitle{font-size:15px;font-weight:700;fill:var(--text)}
.small{font-size:10px;fill:var(--muted)}
.label{font-size:11px;font-weight:700;fill:var(--text)}
.flow{fill:none;stroke:var(--text);stroke-width:2}
.messageFlow{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-dasharray:7 5}
.messageSource{fill:#fff;stroke:var(--muted);stroke-width:1.5}
.messageEvent{fill:#fff;stroke:var(--text);stroke-width:2}
.messageIcon{fill:none;stroke:var(--text);stroke-width:1.4;stroke-linejoin:round}
.sendEnvelope{fill:var(--text);stroke:var(--text);stroke-width:1.2;stroke-linejoin:round}
.messageLabel{font-size:10px;fill:var(--muted);font-weight:600}
.envelope{fill:none;stroke:var(--text);stroke-width:1.5;stroke-linejoin:round}

.gateway{fill:#fff;stroke:var(--text);stroke-width:2}
.event{fill:#fff;stroke:var(--text);stroke-width:2.2}
.end{fill:#fff;stroke:var(--text);stroke-width:3.3}
.note{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
@media print {
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .scroller{border:0;padding:0;overflow:visible}
  svg{min-width:0;width:100%}
  .note{display:none}
  @page{size:A3 landscape;margin:8mm}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>ACCESSIO BPMN COLLABORATION — PARTICIPATORY ACCESSIBILITY & UX STUDY</h1>
  <div class="scroller">
  <svg viewBox="0 0 3450 1040" role="img" aria-labelledby="title desc">
    <title id="title">ACCESSIO BPMN COLLABORATION — PARTICIPATORY ACCESSIBILITY & UX STUDY</title>
    <desc id="desc">Accessio BPMN collaboration with three independent pools: Client organisation, Accessio, and People with disabilities. Sequence flows remain within each pool; communication between pools uses message flows with an open source circle and open arrowhead. Notifications use BPMN message markers.</desc>
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0L10 5L0 10z" fill="#172033"/>
      </marker>

      <marker id="msgArr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M1 1L11 6L1 11z" fill="#ffffff" stroke="#667085" stroke-width="1.3"/>
      </marker>
    </defs>

    <!-- Three independent BPMN pools -->
    <rect class="pool" x="30" y="85" width="3370" height="225" rx="4"/>
    <rect class="pool" x="30" y="340" width="3370" height="225" rx="4"/>
    <rect class="pool" x="30" y="595" width="3370" height="225" rx="4"/>

    <rect class="laneBand" x="30" y="85" width="210" height="225"/>
    <rect class="laneBand" x="30" y="340" width="210" height="225"/>
    <rect class="laneBand" x="30" y="595" width="210" height="225"/>

    <text x="135" y="185" text-anchor="middle" class="laneTitle">Client</text>
<text x="135" y="213" text-anchor="middle" class="laneTitle">organisation</text>
    <text x="135" y="244" text-anchor="middle" class="small">External participant</text>
    <text x="135" y="458" text-anchor="middle" class="laneTitle">Accessio</text>
    <text x="135" y="484" text-anchor="middle" class="small">Service orchestrator</text>
    <text x="135" y="680" text-anchor="middle" class="laneTitle">People with</text>
<text x="135" y="708" text-anchor="middle" class="laneTitle">disabilities</text>
    <text x="135" y="774" text-anchor="middle" class="small">Participants / testers</text>

    <!-- Start -->
    <circle class="event" cx="295" cy="180" r="25"/>
    <text x="295" y="245" text-anchor="middle" class="small">Evaluation</text>
    <text x="295" y="261" text-anchor="middle" class="small">need</text>


    <!-- Accessio message start event -->
    <circle class="messageEvent" cx="305" cy="441" r="23"/>
    <rect class="messageIcon" x="293" y="434" width="24" height="15" rx="1"/>
    <path class="messageIcon" d="M294 436 L305 444 L316 436"/>
    <text x="305" y="478" text-anchor="middle" class="small">Study request received</text>

    <!-- Participant message start event -->
    <circle class="messageEvent" cx="625" cy="705" r="23"/>
    <rect class="messageIcon" x="613" y="698" width="24" height="15" rx="1"/>
    <path class="messageIcon" d="M614 700 L625 708 L636 700"/>
    <text x="625" y="742" text-anchor="middle" class="small">Invitation received</text>

    <!-- Cards -->
    <rect class="org" x="360" y="115" width="250" height="120" rx="18"/>
    <text x="485" y="149" text-anchor="middle" class="taskTitle">Submit the service</text>
<text x="485" y="169" text-anchor="middle" class="taskTitle">or prototype</text>
    <text x="485" y="197" text-anchor="middle" class="taskSub">Define objectives, use cases</text>
<text x="485" y="215" text-anchor="middle" class="taskSub">and test scenarios</text>

    <rect class="access" x="365" y="385" width="250" height="112" rx="18"/>
    <text x="490" y="420" text-anchor="middle" class="taskTitle">Configure the study</text>
    <text x="490" y="458" text-anchor="middle" class="taskSub">Criteria · format · duration</text>
<text x="490" y="476" text-anchor="middle" class="taskSub">accessibility · consent</text>

    <rect class="access" x="690" y="385" width="250" height="112" rx="18"/>
    <text x="815" y="418" text-anchor="middle" class="taskTitle">Identify & recruit</text>
<text x="815" y="438" text-anchor="middle" class="taskTitle">a suitable panel</text>
    <text x="815" y="459" text-anchor="middle" class="taskSub">Needs · profiles · assistive</text>
<text x="815" y="477" text-anchor="middle" class="taskSub">technologies · availability</text>

    <rect class="user" x="690" y="645" width="250" height="120" rx="18"/>
    <text x="815" y="680" text-anchor="middle" class="taskTitle">Sign up for the study</text>
<text x="815" y="700" text-anchor="middle" class="taskTitle">and confirm participation</text>
    <text x="815" y="731" text-anchor="middle" class="taskSub">Availability · consent</text>
<text x="815" y="749" text-anchor="middle" class="taskSub">accommodation needs</text>

    <rect class="access" x="1015" y="385" width="250" height="112" rx="18"/>
    <text x="1140" y="420" text-anchor="middle" class="taskTitle">Prepare participation</text>
    <text x="1140" y="455" text-anchor="middle" class="taskSub">Accessible information</text>
<text x="1140" y="473" text-anchor="middle" class="taskSub">accommodations · scheduling · compensation</text>

    <rect class="user" x="1015" y="645" width="250" height="120" rx="18"/>
    <text x="1140" y="680" text-anchor="middle" class="taskTitle">Take part in the test</text>
<text x="1140" y="700" text-anchor="middle" class="taskTitle">under real conditions</text>
    <text x="1140" y="731" text-anchor="middle" class="taskSub">Moderated / unmoderated test</text>
<text x="1140" y="749" text-anchor="middle" class="taskSub">with access needs supported</text>

    <rect class="user" x="1345" y="645" width="250" height="120" rx="18"/>
    <text x="1470" y="680" text-anchor="middle" class="taskTitle">Share feedback</text>
<text x="1470" y="700" text-anchor="middle" class="taskTitle">and observations</text>
    <text x="1470" y="731" text-anchor="middle" class="taskSub">Barriers · real-world use</text>
<text x="1470" y="749" text-anchor="middle" class="taskSub">needs · suggestions</text>

    <rect class="access" x="1345" y="385" width="250" height="112" rx="18"/>
    <text x="1470" y="420" text-anchor="middle" class="taskTitle">Consolidate & analyse</text>
    <text x="1470" y="458" text-anchor="middle" class="taskSub">Results · insights</text>
<text x="1470" y="476" text-anchor="middle" class="taskSub">recommendations</text>

    <rect class="org" x="1335" y="115" width="270" height="120" rx="18"/>
    <text x="1470" y="149" text-anchor="middle" class="taskTitle">Receive the findings</text>
    <text x="1470" y="197" text-anchor="middle" class="taskSub">Test summary</text>
<text x="1470" y="215" text-anchor="middle" class="taskSub">+ improvement recommendations</text>

    <!-- BPMN Receive Task marker: unfilled envelope -->
    <g aria-label="Receive findings message">
      <rect class="messageIcon" x="1352" y="200" width="24" height="16" rx="1"/>
      <path class="messageIcon" d="M1353 202 L1364 210 L1375 202"/>
    </g>

    <rect class="org" x="1675" y="115" width="250" height="120" rx="18"/>
    <text x="1800" y="149" text-anchor="middle" class="taskTitle">Implement</text>
<text x="1800" y="169" text-anchor="middle" class="taskTitle">the improvements</text>
    <text x="1800" y="206" text-anchor="middle" class="taskSub">Product / service corrections</text>

    <rect class="access" x="1675" y="385" width="250" height="112" rx="18"/>
    <text x="1800" y="417" text-anchor="middle" class="taskTitle">Send correction</text>
<text x="1800" y="437" text-anchor="middle" class="taskTitle">validation notification</text>
    <text x="1800" y="458" text-anchor="middle" class="taskSub">Inform the participant about</text>
<text x="1800" y="476" text-anchor="middle" class="taskSub">the changes implemented</text>


    <!-- BPMN Send Task marker: filled envelope -->
    <g aria-label="Send message">
      <rect class="sendEnvelope" x="1692" y="465" width="24" height="16" rx="1"/>
      <path d="M1693 467 L1704 475 L1715 467" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <rect class="user" x="1675" y="645" width="250" height="120" rx="18"/>
    <text x="1800" y="680" text-anchor="middle" class="taskTitle">Perform follow-up</text>
<text x="1800" y="700" text-anchor="middle" class="taskTitle">validation</text>
    <text x="1800" y="731" text-anchor="middle" class="taskSub">Retest the corrections</text>
<text x="1800" y="749" text-anchor="middle" class="taskSub">under real conditions</text>

    <rect class="user" x="2005" y="645" width="250" height="120" rx="18"/>
    <text x="2130" y="680" text-anchor="middle" class="taskTitle">Share validation</text>
<text x="2130" y="700" text-anchor="middle" class="taskTitle">results</text>
    <text x="2130" y="731" text-anchor="middle" class="taskSub">Corrections validated or</text>
<text x="2130" y="749" text-anchor="middle" class="taskSub">barriers still present</text>

    <rect class="access" x="2005" y="385" width="250" height="112" rx="18"/>
    <text x="2130" y="418" text-anchor="middle" class="taskTitle">Record the</text>
<text x="2130" y="438" text-anchor="middle" class="taskTitle">validation</text>
    <text x="2130" y="465" text-anchor="middle" class="taskSub">Track the follow-up result</text>

    <rect class="org" x="2005" y="115" width="250" height="120" rx="18"/>
    <text x="2130" y="149" text-anchor="middle" class="taskTitle">Receive the</text>
<text x="2130" y="169" text-anchor="middle" class="taskTitle">validation</text>
    <text x="2130" y="206" text-anchor="middle" class="taskSub">User follow-up result</text>

    <!-- BPMN Receive Task marker: unfilled envelope -->
    <g aria-label="Receive validation message">
      <rect class="messageIcon" x="2022" y="200" width="24" height="16" rx="1"/>
      <path class="messageIcon" d="M2023 202 L2034 210 L2045 202"/>
    </g>

    <!-- Gateway moved right for a longer connector -->
    <polygon class="gateway" points="2475,135 2515,175 2475,215 2435,175"/>
    <text x="2475" y="183" text-anchor="middle" class="taskTitle">×</text>
    <!-- Question moved down -->
    <text x="2475" y="252" text-anchor="middle" class="taskTitle">Have the identified barriers been resolved?</text>

    <!-- Correction card moved right -->
    <rect class="org" x="2825" y="115" width="260" height="120" rx="18"/>
    <text x="2955" y="149" text-anchor="middle" class="taskTitle">Decide on additional</text>
<text x="2955" y="169" text-anchor="middle" class="taskTitle">corrections</text>
    <text x="2955" y="206" text-anchor="middle" class="taskSub">Client organisation response</text>

    <!-- Close/payment cards moved right to remove overlap -->
    <rect class="access" x="2375" y="385" width="250" height="112" rx="18"/>
    <text x="2500" y="420" text-anchor="middle" class="taskTitle">Close the study</text>
    <text x="2500" y="458" text-anchor="middle" class="taskSub">Validation recorded</text>
<text x="2500" y="476" text-anchor="middle" class="taskSub">and study file finalised</text>


    <!-- Client process end event -->
    <circle class="end" cx="2635" cy="267" r="18"/>
    <circle cx="2635" cy="267" r="11" fill="none" stroke="#172033" stroke-width="1.7"/>
    <text x="2635" y="299" text-anchor="middle" class="small">Client cycle ended</text>
    <path class="flow" d="M2475 215 V267 H2610" marker-end="url(#arr)"/>

    <!-- Participant process end event -->
    <circle class="end" cx="2370" cy="705" r="18"/>
    <circle cx="2370" cy="705" r="11" fill="none" stroke="#172033" stroke-width="1.7"/>
    <text x="2370" y="738" text-anchor="middle" class="small">Participation ended</text>
    <path class="flow" d="M2255 705 H2345" marker-end="url(#arr)"/>

    <!-- End moved right -->
    <circle class="end" cx="3100" cy="440" r="28"/>
    <circle cx="3100" cy="440" r="18" fill="none" stroke="#172033" stroke-width="2"/>
    <text x="3100" y="488" text-anchor="middle" class="taskTitle">End of study</text>
    <text x="3100" y="509" text-anchor="middle" class="small">Cycle completed</text>

    <!-- Sequence flows -->

    <!-- Internal sequence flow: client process continuity -->
    <path class="flow" d="M610 175 H1335" marker-end="url(#arr)"/>
    <path class="flow" d="M1925 175 H2005" marker-end="url(#arr)"/>

    <!-- Internal sequence flow: Accessio process continuity -->
    <path class="flow" d="M328 441 H365" marker-end="url(#arr)"/>
    <path class="flow" d="M615 441 H690" marker-end="url(#arr)"/>
    <path class="flow" d="M940 441 H1015" marker-end="url(#arr)"/>
    <path class="flow" d="M1265 441 H1345" marker-end="url(#arr)"/>
    <path class="flow" d="M1595 441 H1675" marker-end="url(#arr)"/>
    <path class="flow" d="M1925 441 H2005" marker-end="url(#arr)"/>
    <path class="flow" d="M2255 441 H2375" marker-end="url(#arr)"/>

    <!-- Internal sequence flow: participant process continuity -->
    <path class="flow" d="M648 705 H690" marker-end="url(#arr)"/>
    <path class="flow" d="M940 705 H1015" marker-end="url(#arr)"/>
    <path class="flow" d="M1265 705 H1345" marker-end="url(#arr)"/>
    <path class="flow" d="M1595 705 H1675" marker-end="url(#arr)"/>
    <path class="flow" d="M1925 705 H2005" marker-end="url(#arr)"/>

    <path class="flow" d="M320 180 H348" marker-end="url(#arr)"/>
    <circle class="messageSource" cx="485" cy="235" r="4"/>
    <path class="messageFlow" d="M485 235 V373" marker-end="url(#msgArr)"/>
    
    <circle class="messageSource" cx="815" cy="497" r="4"/>
    <path class="messageFlow" d="M815 497 V633" marker-end="url(#msgArr)"/>

    
    
    <circle class="messageSource" cx="1140" cy="497" r="4"/>
    <path class="messageFlow" d="M1140 497 V633" marker-end="url(#msgArr)"/>

    
    <circle class="messageSource" cx="1470" cy="645" r="4"/>
    <path class="messageFlow" d="M1470 645 V509" marker-end="url(#msgArr)"/>
    <circle class="messageSource" cx="1470" cy="385" r="4"/>
    <path class="messageFlow" d="M1470 385 V247" marker-end="url(#msgArr)"/>
    <path class="flow" d="M1605 175 H1663" marker-end="url(#arr)"/>

    <circle class="messageSource" cx="1800" cy="235" r="4"/>
    <path class="messageFlow" d="M1800 235 V373" marker-end="url(#msgArr)"/>
    <circle class="messageSource" cx="1800" cy="497" r="4"/>
    <path class="messageFlow" d="M1800 497 V633" marker-end="url(#msgArr)"/>

    
    <circle class="messageSource" cx="2130" cy="645" r="4"/>
    <path class="messageFlow" d="M2130 645 V509" marker-end="url(#msgArr)"/>
    <circle class="messageSource" cx="2130" cy="385" r="4"/>
    <path class="messageFlow" d="M2130 385 V247" marker-end="url(#msgArr)"/>


    <!-- Message flow labels -->
    <text x="510" y="305" class="messageLabel">Study request</text>
    <text x="835" y="575" class="messageLabel">Study invitation</text>
    <text x="1490" y="305" class="messageLabel">Study findings</text>
    <text x="1820" y="305" class="messageLabel">Implemented corrections</text>
    <text x="1820" y="575" class="messageLabel">Correction notification</text>
    <text x="1490" y="575" class="messageLabel">Participant feedback</text>
    <text x="2150" y="575" class="messageLabel">Validation result</text>
    <text x="2150" y="305" class="messageLabel">Validation result</text>

    <!-- Longer connector from Receive validation to gateway -->
    <path class="flow" d="M2255 175 H2423" marker-end="url(#arr)"/>

    <path class="flow" d="M2515 175 H2813" marker-end="url(#arr)"/>
    <text x="2640" y="157" class="label">NO</text>

    <circle class="messageSource" cx="2475" cy="215" r="4"/>
    <path class="messageFlow" d="M2475 215 V373" marker-end="url(#msgArr)"/>
    <text x="2495" y="325" class="label">YES</text>

    <path class="flow" d="M2625 441 H3065" marker-end="url(#arr)"/>

    <!-- Correction loop; label moved down away from top connector -->
    <path class="flow" d="M2955 115 V92 H1800 V103" marker-end="url(#arr)"/>
    <text x="2375" y="108" text-anchor="middle" class="small">Additional corrections → new implementation</text>
    <!-- Legend -->
    <text x="300" y="905" text-anchor="middle" class="taskTitle">LEGEND</text>
    <circle class="event" cx="374" cy="904" r="14"/>
    <text x="401" y="909" class="small">Start event</text>
    <polygon class="gateway" points="540,890 554,904 540,918 526,904"/>
    <text x="568" y="909" class="small">Exclusive gateway</text>
    <path class="flow" d="M760 904 H820" marker-end="url(#arr)"/>
    <text x="838" y="909" class="small">Sequence flow</text>
    <circle class="end" cx="1074" cy="904" r="14"/>
    <text x="1100" y="909" class="small">End event</text>
  </svg>
  </div>
  <div class="note">Tip: open this page in a browser and use Print → Save as PDF for a vector-quality export.</div>
</div>
</body>
</html>
